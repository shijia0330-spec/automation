name: Playwright Tests

on:
  push:
    paths:
      - "playwright_learning/**"
      - ".github/workflows/playwright-tests.yml"
      - "pytest.ini"
  pull_request:
    paths:
      - "playwright_learning/**"
      - ".github/workflows/playwright-tests.yml"
      - "pytest.ini"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-playwright-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            playwright==1.61.0 \
            pytest-playwright==0.8.0

      - name: Run Playwright smoke tests
        env:
          CLIENT_USER_1_USERNAME: ${{ secrets.CLIENT_USER_1_USERNAME }}
          CLIENT_USER_1_PASSWORD: ${{ secrets.CLIENT_USER_1_PASSWORD }}
          CLIENT_USER_2_USERNAME: ${{ secrets.CLIENT_USER_2_USERNAME }}
          CLIENT_USER_2_PASSWORD: ${{ secrets.CLIENT_USER_2_PASSWORD }}
        run: |
          pytest -m smoke -q playwright_learning/tests \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --output=test-results

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
