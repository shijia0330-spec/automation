name: Playwright Tests

on:
  push:
    paths:
      - "playwright_learning/**"
      - ".github/workflows/playwright-tests.yml"
      - "pytest.ini"
  pull_request:
    paths:
      - "playwright_learning/**"
      - ".github/workflows/playwright-tests.yml"
      - "pytest.ini"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-playwright-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          CLIENT_USER_1_USERNAME: ${{ secrets.CLIENT_USER_1_USERNAME }}
          CLIENT_USER_1_PASSWORD: ${{ secrets.CLIENT_USER_1_PASSWORD }}
          CLIENT_USER_2_USERNAME: ${{ secrets.CLIENT_USER_2_USERNAME }}
          CLIENT_USER_2_PASSWORD: ${{ secrets.CLIENT_USER_2_PASSWORD }}
        run: pytest -m smoke -q playwright_learning/tests
